<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2fb0"/>
      <stop offset="0.55" stop-color="#1f47b8"/>
      <stop offset="1" stop-color="#0c8a86"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.22" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#36f0bd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#36f0bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- squircle body: each layer carries the same rounded shape (no clip paths, renders everywhere) -->
  <rect x="8" y="8" width="240" height="240" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="72" fill="url(#glow1)"/>
  <rect x="8" y="8" width="240" height="240" rx="72" fill="url(#glow2)"/>
  <!-- radio waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="13">
    <path d="M100 96 A44 44 0 0 0 100 160"/>
    <path d="M156 96 A44 44 0 0 1 156 160"/>
    <path d="M76 72 A78 78 0 0 0 76 184" stroke-opacity="0.6"/>
    <path d="M180 72 A78 78 0 0 1 180 184" stroke-opacity="0.6"/>
  </g>
  <circle cx="128" cy="128" r="19" fill="#ffffff"/>
  <!-- glass highlight and rim -->
  <rect x="22" y="16" width="212" height="100" rx="50" fill="url(#sheen)"/>
  <rect x="9" y="9" width="238" height="238" rx="71" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
